# place this file at ~/.config/unikode/unikode.toml
# or in the working directory as ./unikode.toml

[editor]
line_mode = "relative"       # "relative" or "absolute"
show_mode = true             # show mode in the modeline
# box_cursor_start = false   # move the cursor to the box start after drawing
# keep_trailing_ws = false   # keep trailing whitespace on save
# strip_margin_ws = false    # strip all margin whitespace on save
# render_mode = "braille"    # "classic" or "braille"
# path_mode = "snap90"       # "snap90" or "routed"
# gutter_width = 5           # line number gutter width

# [editor.scroll]
# mouse_drag_step = 2        # scroll step while dragging
# cursor_step = 1            # scroll step while moving the cursor

[colors]
# background = "#212121"
# normal = "#ffffff"
# dirty = "#ffffff"
# dirty_bg = "#316AC5"
# cursor_fg = "#ffffff"
# cursor_bg = "#316AC5"
# selection_fg = "#ffffff"
# selection_bg = "#316AC5"
# ui = "#ffffff"
# ui_active = "#ffff00"

[symbols]
# n = "▲"
# s = "▼"
# w = "◀"
# e = "▶"
# dash = "-"
# pipe = "|"
# diag = "/"
