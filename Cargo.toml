[package]
name = "unikode"
description = "TUI based Unicode diagram editor."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["stevenp2 <s.phung808@gmail.com>", "nytopop <ericizoita@gmail.com>"]
license = "MIT"
homepage = "https://github.com/stevenp2/unikode"
repository = "https://github.com/stevenp2/unikode.git"

[dependencies]
clipboard = "0.5.0"
clap = { version = "4.5", features = ["derive"] }
cursive = "0.21.1"
dirs = "5"
line_drawing = "1.0.0"
log = "0.4.22"
num-traits = "0.2.19"
parking_lot = "0.12.3"
pathfinding = "4.11.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
